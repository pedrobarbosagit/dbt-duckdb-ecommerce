[project]
name = "dbt-duckdb-ecommerce"
version = "0.1.0"
description = "A dbt project on DuckDB over the Olist Brazilian e-commerce dataset: staging, marts, tests, contracts, snapshot, CI."
readme = "README.md"
authors = [{ name = "Pedro Barbosa" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "dbt-core>=1.12.6,<2",
    "dbt-duckdb>=1.11.1,<2",
    "kagglehub>=1.0.3",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
