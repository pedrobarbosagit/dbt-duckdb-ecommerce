name: ecommerce
version: "0.1.0"
config-version: 2
profile: ecommerce

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Folder with the raw Olist CSVs. CI overrides it with the small synthetic fixtures.
  olist_data_dir: data/olist

models:
  ecommerce:
    +on_schema_change: fail
    staging:
      +materialized: view
      +tags: [staging]
    intermediate:
      +materialized: view
      +tags: [intermediate]
    marts:
      +materialized: table
      +tags: [marts]
