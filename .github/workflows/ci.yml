name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dbt:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint Python scripts
        run: |
          uv run ruff check scripts
          uv run ruff format --check scripts

      - name: Install dbt packages
        run: uv run dbt deps

      # The real Olist data is not in the repository (licence), so CI runs on the small
      # synthetic dataset with the same schema: models, tests, unit tests and snapshot.
      - name: Build and test on the synthetic fixtures
        run: uv run dbt build --vars '{olist_data_dir: tests/fixtures/olist}'

      - name: Generate docs
        run: uv run dbt docs generate --vars '{olist_data_dir: tests/fixtures/olist}'
